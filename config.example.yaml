# 复制为 config.yaml 后填写，改动后重启生效。
# 带 # 的设置行是可选项，值即默认值：去掉 # 再修改才生效（注意保持缩进）。
# 整段被注释的配置块，要连同第一行的块名一起取消注释。

# ---- 角色与故事（characterName、characterProfile 必填）----
storyDefaults:
  characterName: Alice
  characterProfile: |
    请在这里填写角色背景、性格、日常生活和说话方式。
    可以直接换行写多段。
  world: 当代现实生活。
  location: 新加坡
  timezone: Asia/Singapore          # IANA 时区名，决定故事时间、休息窗口和每日额度
  userProfile: ""                   # 主人的资料（只在主人私聊可见）
  relationship: ""                  # Alice 与主人的关系（只在主人私聊可见）
  # perspective: ""                 # 个人价值观
  # supportingCast: ""              # 配角
  # style: 现实主义日常叙事，情绪克制，关系变化缓慢而具体。

# ---- 运行与调度 ----
runtime:
  autoCreate: true                  # 第一次获授权私聊时自动创建故事
  allowProactiveMessages: false     # 是否允许主动可见联系
  # proactiveWillingnessThreshold: 0.65
  # captureDirectMessages: true
  # ignoreCommandMessages: true
  # sweepIntervalMinutes: 5         # 后台扫描间隔
  # minimumAdvanceMinutes: 30
  # maxStoriesPerSweep: 20
  # contextEntryLimit: 30
  # memoryLimit: 20
  # maxScriptCharacters: 8000
  # maxMessageCharacters: 2000
  # minimumDelayedReplySeconds: 10
  # maximumDelayedReplyMinutes: 1440
  # cancelDelayedRepliesOnUserMessage: true
  # narrativeRetryDelaySeconds: 60  # 模型请求失败后的重试间隔
  # narrativeRetryMaxAttempts: 6    # 0 为不重试
  # splitReplyMessages: true        # 把回复拆成多条消息
  # messageSeparator: "<sep/>"
  # typingBaseDelaySeconds: 1
  # typingCharactersPerSecond: 8
  # typingMaxDelaySeconds: 12
  # typingJitterRatio: 0.3          # 打字时间随机浮动 ±30%，0 为固定
  # userMessageDebounceSeconds: 2   # 等待连续消息的秒数
  # autoAdvanceEnabled: true        # 后台生活推进
  # autoAdvanceIntervalMinutes: 40
  # autoAdvanceJitterMinutes: 5
  # conversationFollowUpMinutes: [10, 20]   # 对话结束后的短期生活补写
  # conversationFollowUpJitterMinutes: 1
  # restWindows:
  #   - enabled: true
  #     label: night sleep
  #     start: "23:00"
  #     end: "07:00"
  #     minIntervalMinutes: 120
  #     maxIntervalMinutes: 240
  # urge:                           # 推进间隔随对话密度和生活节奏伸缩
  #   enabled: false
  #   activeMultiplier: 1.4
  #   restMultiplier: 0.6
  #   halfLifeMinutes: 90

# ---- Telegram 资料（只补充资料，访问权限只由 .env 的白名单决定）----
telegram:
